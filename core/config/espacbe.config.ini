; Valeurs par défaut du plugin, lues par config::byKey(<clé>, 'espacbe').
; La section doit porter l'identifiant du plugin, sinon le fichier est inerte.
[espacbe]

; Broker MQTT : Mosquitto sur la box Jeedom par défaut.
broker::host = "127.0.0.1"
broker::port = 1883
broker::username = ""
broker::password = ""
; Identifiant client MQTT, engendré une fois puis mémorisé.
broker::clientId = ""

; Préfixe des topics du contrat ESPAC : <prefix>/<dev>/...
topic::prefix = "espac"

; Créer automatiquement un équipement pour chaque module qui s'annonce.
discovery::autoCreate = 1

; Port local (127.0.0.1) par lequel Jeedom transmet ses ordres au démon.
daemon::socketport = 55140
